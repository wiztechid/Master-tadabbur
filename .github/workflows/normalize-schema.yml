name: Normalize 94 Landing Schemas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-schema.yml'
      - '.github/scripts/normalize_schema.py'
      - 'tadabbur/**/index.html'
      - 'en/tadabbur/**/index.html'

concurrency:
  group: normalize-schema-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and QC schema
        id: normalize
        run: python3 .github/scripts/normalize_schema.py

      - name: Upload schema QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadabburlife-schema-normalization-qc
          path: qc-schema-report/
          if-no-files-found: error
          retention-days: 30

      - name: Commit normalized landing schemas
        run: |
          if git diff --quiet -- tadabbur en/tadabbur; then
            echo "No landing schema changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tadabbur en/tadabbur
          git commit -m "SEO: normalize Article and BreadcrumbList schema across 94 landings"
          git pull --rebase origin main
          git push
