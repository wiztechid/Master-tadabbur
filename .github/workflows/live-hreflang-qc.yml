name: Live Canonical Hreflang QC

# GitHub Mode Hemat WIZ: heavy/live workflow — manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-hreflang:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate live canonical and hreflang reciprocity
        run: python3 .github/scripts/live_hreflang_qc.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadabburlife-live-hreflang-qc
          path: qc-live-hreflang-report/
          if-no-files-found: error
          retention-days: 30
