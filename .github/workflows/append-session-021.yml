name: Append Tadabbur Session 021
on:
  push:
    paths:
      - '.github/workflows/append-session-021.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append session 021 to public and owner masters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ID_INDEX='''<div class="index-item" data-search="takaran timbangan hak muamalah ekonomi al-mutaffifin 83 1 2 3 curang integritas transaksi pelayanan" onclick="showSession(21)"><b>021 — Jangan Kurangi Hak Orang Lain</b><br/><small>Al-Mutaffifin 1–3 • Takaran, hak, muamalah, integritas, keadilan transaksi</small></div>'''
          EN_INDEX='''<div class="index-item en-index-item" data-search="measure weight rights transactions economy al-mutaffifin 83 1 2 3 fraud integrity service" onclick="showEnglishSession(21)"><b>021 — Do Not Give People Less Than Their Due</b><br/><small>Al-Mutaffifin 1–3 • Measure, rights, transactions, integrity, fairness</small></div>'''

          ID_SESSION='''
<article class="session" data-lang="id" data-session-number="21" id="s21">
<div class="session-head"><small>SESI 021 • AL-MUTAFFIFIN 83:1–3 • TEMATIK/NON-LINEAR</small><h2>Jangan Kurangi Hak Orang Lain</h2><p>Kecurangan tidak selalu hadir dalam bentuk pencurian yang terang-terangan. Ia dapat muncul ketika seseorang menuntut haknya secara penuh, tetapi saat giliran memenuhi hak orang lain ia mengurangi ukuran, mutu, waktu, informasi, atau kewajiban yang seharusnya diberikan.</p></div>
<section class="feature card"><h3>🌙 Ayat Utama Hari Ini</h3><div class="ayahbox"><div class="ayah">وَيْلٌۭ لِّلْمُطَفِّفِينَ ۝ ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ ۝ وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ</div><div class="latin">Wailul lil-muṭaffifīn. Allażīna iżaktālū ‘alan-nāsi yastaufūn. Wa iżā kālūhum au wazanūhum yukhsirūn.</div><div class="tr"><b>Al-Mutaffifin 83:1–3 — Makna ringkas:</b> Celaka bagi orang-orang yang curang dalam takaran: ketika menerima dari orang lain mereka meminta dipenuhi, tetapi ketika menakar atau menimbang untuk orang lain mereka mengurangi.</div></div><p>Ayat ini menyorot ketimpangan moral yang sangat dekat dengan kehidupan sehari-hari: <b>standar penuh untuk diri sendiri, standar lebih rendah untuk orang lain</b>. Al-Qur'an membongkar bukan hanya angka pada timbangan, tetapi watak di balik kecurangan itu.</p></section>
<section class="card"><h3>📚 Tafsir</h3><details open><summary>Siapa al-muṭaffifīn?</summary><p>Dalam tafsir Ibn Kathir terhadap Al-Mutaffifin 83:1–3, <i>tatfif</i> dijelaskan sebagai mengurangi takaran atau timbangan. Orang yang dicela adalah mereka yang mengambil haknya dari orang lain secara penuh tetapi mengurangi ketika memenuhi hak orang lain.</p></details><details><summary>Larangan ini menjaga keadilan muamalah</summary><p>Al-Tabari menjelaskan kecaman ayat terhadap orang yang mengurangi hak manusia dalam ukuran dan timbangan. Prinsipnya menuntut kejujuran ketika menerima maupun menyerahkan hak, bukan standar yang berubah sesuai siapa yang diuntungkan.</p></details><details><summary>Makna moralnya lebih luas tanpa menghapus konteks asli</summary><p>Konteks langsung ayat adalah takaran dan timbangan. Sebagai pelajaran, pola yang sama dapat dikenali ketika seseorang menuntut kewajiban orang lain secara penuh tetapi sengaja mengurangi kewajibannya sendiri. Ini adalah analogi penerapan prinsip, bukan penggantian makna asli ayat.</p></details></section>
<section class="card secondary"><h3>🤲 Hadis Sahih</h3><p>Dalam <b>Sahih Muslim 102</b>, Rasulullah ﷺ melewati tumpukan makanan yang dijual. Setelah beliau menemukan bagian yang basah tersembunyi di dalam, beliau menegur penjual agar bagian itu diletakkan terlihat oleh pembeli dan bersabda bahwa <b>siapa yang menipu bukanlah dari golongan beliau</b>.</p><p>Hadis ini menambahkan sisi penting pada keadilan transaksi: bukan hanya jumlah yang harus benar, tetapi informasi yang memengaruhi hak pihak lain juga tidak boleh sengaja disembunyikan.</p></section>
<section class="card secondary"><h3>🌍 Konteks Faktual</h3><p><b>Fakta dari nash:</b> Al-Mutaffifin 83:1–3 mengecam pengurangan takaran atau timbangan ketika hak orang lain dipenuhi, sedangkan hadis sahih melarang penipuan dalam transaksi.</p><p><b>Pelajaran/analogi:</b> prinsip ini relevan pada perdagangan, pekerjaan, layanan publik, kontrak, pengadaan, pelaporan, dan hubungan sosial: jangan menuntut output penuh dari pihak lain sambil sengaja mengurangi kewajiban sendiri. Dalam pemerintahan, misalnya, ketepatan volume, mutu, waktu, dokumen, dan pembayaran adalah wilayah yang membutuhkan ukuran yang dapat diperiksa.</p><p><b>Batas:</b> ayat ini tidak menunjuk sistem administrasi modern tertentu dan tidak menjadi ramalan tentang kasus ekonomi tertentu. Penerapan modern harus tetap mengikuti fakta, akad, aturan, dan bukti yang relevan.</p></section>
<section class="card secondary"><h3>🪞 Muhasabah</h3><p>Apakah saya lebih teliti ketika menghitung apa yang menjadi hak saya daripada ketika menghitung apa yang menjadi hak orang lain?</p><p>Dalam pekerjaan atau transaksi terakhir saya, adakah mutu, waktu, informasi, atau kewajiban yang saya harapkan penuh dari orang lain tetapi saya sendiri belum memberikannya dengan standar yang sama?</p></section>
<section class="card call"><h3>💡 Hikmah Utama</h3><p><b>Integritas terlihat ketika ukuran yang kita tuntut untuk diri sendiri juga kita gunakan saat memenuhi hak orang lain.</b></p></section>
<section class="card"><h3>✅ Amal Praktis Hari Ini</h3><p>Pilih satu kewajiban yang menyangkut hak orang lain—pembayaran, pekerjaan, pelayanan, janji waktu, kualitas barang, atau informasi. <b>Periksa satu kali lagi sebelum diserahkan:</b> apakah jumlah, mutu, waktu, dan keterangannya sudah sama jujurnya dengan standar yang Anda harapkan jika Anda berada di pihak penerima?</p></section>
<section class="card secondary"><h3>🔗 Hubungan dengan Perjalanan</h3><p><b>Sesi 020</b> menuntut keadilan bahkan ketika emosi mendorong kita untuk memihak. Sesi 021 membawa keadilan ke meja transaksi dan pemenuhan kewajiban: jangan gunakan dua ukuran—satu ketika menerima hak, satu lagi ketika memberi hak. Al-Mutaffifin 83:1–3 adalah ayat baru dalam perjalanan ini.</p></section>
<div class="finish-reflection-wrap" data-lang="id" data-session="21"><p>Sudah selesai membaca dan merenungkan sesi ini? Tandai selesai agar status pada Journey/Home ikut diperbarui.</p><button class="complete-reflection-btn primary" type="button">✓ Tandai Selesai Tadabbur</button></div><div class="session-nav"><button onclick="showSession(20)">← Sesi 020</button><button onclick="showJourney()">☰ Daftar</button><span class="btn disabled">Sesi 022 →</span></div></article>
'''

          EN_SESSION='''
<article class="en-session" data-lang="en" data-session-number="21" id="en-s21">
<div class="session-head"><small>SESSION 021 • AL-MUTAFFIFIN 83:1–3 • THEMATIC/NON-LINEAR</small><h2>Do Not Give People Less Than Their Due</h2><p>Dishonesty does not always appear as obvious theft. It can appear when a person demands his own rights in full, yet reduces the measure, quality, time, information, or obligation owed when it is his turn to fulfill another person's rights.</p></div>
<section class="feature card"><h3>🌙 Today's Key Verse</h3><div class="ayahbox"><div class="ayah">وَيْلٌۭ لِّلْمُطَفِّفِينَ ۝ ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ ۝ وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ</div><div class="latin">Wailul lil-muṭaffifīn. Allażīna iżaktālū ‘alan-nāsi yastaufūn. Wa iżā kālūhum au wazanūhum yukhsirūn.</div><div class="tr"><b>Al-Mutaffifin 83:1–3 — M. Pickthall:</b> Woe unto the defrauders: Those who when they take the measure from mankind demand it full, But if they measure unto them or weigh for them, they cause them loss.</div></div><div class="en-note">English Qur'an translation reference: M. Pickthall (public-domain translation). Arabic text and transliteration are identical to the Indonesian edition. Transliteration is a reading aid and does not replace tajwid or talaqqi.</div><p>The verses expose a moral imbalance that is close to everyday life: <b>a full standard for oneself, but a lower standard for others</b>. The Qur'an addresses not only the number on a scale, but the character behind the fraud.</p></section>
<section class="card"><h3>📚 Tafsir Notes</h3><details open><summary>Who are al-muṭaffifīn?</summary><p>In Ibn Kathir's tafsir of Al-Mutaffifin 83:1–3, <i>tatfif</i> is explained as giving short measure or weight. Those condemned take their own due from others in full but diminish what they owe when measuring for others.</p></details><details><summary>The prohibition protects fairness in transactions</summary><p>Al-Tabari explains the condemnation of those who diminish people's rights in measure and weight. The principle requires honesty both when receiving and when delivering a due, rather than changing the standard according to who benefits.</p></details><details><summary>A broader moral lesson without erasing the original context</summary><p>The direct context is measure and weight. As a lesson, the same pattern can be recognized when someone demands another person's obligations in full while deliberately reducing his own. This is an analogy in applying the principle, not a replacement of the verse's original meaning.</p></details></section>
<section class="card secondary"><h3>🤲 Authentic Hadith</h3><p>In <b>Sahih Muslim 102</b>, the Prophet ﷺ passed a pile of food offered for sale. When he found wet food hidden underneath, he instructed that it should have been placed where buyers could see it, and taught that <b>whoever deceives is not of him</b>.</p><p>The hadith adds an important dimension to fair dealing: not only must the quantity be truthful, but information that affects another party's rights must not be deliberately concealed.</p></section>
<section class="card secondary"><h3>🌍 Factual Context</h3><p><b>Fact from revelation:</b> Al-Mutaffifin 83:1–3 condemns giving short measure or weight when fulfilling other people's rights, while authentic hadith prohibits deception in transactions.</p><p><b>Lesson/analogy:</b> the principle is relevant to trade, work, public service, contracts, procurement, reporting, and social relations: do not demand full output from others while deliberately reducing your own obligation. In government, for example, accuracy of quantity, quality, time, documentation, and payment are areas where verifiable standards matter.</p><p><b>Boundary:</b> the verses do not point to a particular modern administrative system and are not a prediction about a specific economic case. Modern application must still follow the relevant facts, agreements, rules, and evidence.</p></section>
<section class="card secondary"><h3>🪞 Reflection</h3><p>Am I more careful when calculating what is owed to me than when calculating what I owe to others?</p><p>In my most recent work or transaction, is there any quality, time, information, or obligation that I expect fully from others but have not yet delivered by the same standard myself?</p></section>
<section class="card call"><h3>💡 Main Wisdom</h3><p><b>Integrity appears when the measure we demand for ourselves is also the measure we use when fulfilling other people's rights.</b></p></section>
<section class="card"><h3>✅ Practical Action Today</h3><p>Choose one obligation involving another person's right—a payment, work product, service, promised time, product quality, or information. <b>Check it once more before delivery:</b> are the quantity, quality, timing, and disclosure as honest as the standard you would expect if you were the recipient?</p></section>
<section class="card secondary"><h3>🔗 Connection to the Journey</h3><p><b>Session 020</b> demanded justice even when emotion pushes us to take sides. Session 021 brings justice to transactions and the fulfillment of obligations: do not use two measures—one when receiving rights and another when giving them. Al-Mutaffifin 83:1–3 is new to this journey.</p></section>
<div class="finish-reflection-wrap" data-lang="en" data-session="21"><p>Finished reading and reflecting on this session? Mark it complete so the Journey/Home status stays in sync.</p><button class="complete-reflection-btn primary" type="button">✓ Mark Reflection Complete</button></div><div class="session-nav"><button onclick="showEnglishSession(20)">← Session 020</button><button onclick="showJourney()">☰ Journey</button><span class="btn disabled">Session 022 →</span></div></article>
'''

          def patch(path):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert 'id="s21"' not in s and 'id="en-s21"' not in s
              # Enable S20 -> S21 navigation without changing S20 substance.
              s=s.replace('<span class="btn disabled">Sesi 021 →</span>', '<button class="primary" onclick="showSession(21)">Sesi 021 →</button>')
              s=s.replace('<span class="btn disabled">Session 021 →</span>', '<button class="primary" onclick="showEnglishSession(21)">Session 021 →</button>')
              # Append Journey index entries after the existing S20 entries.
              m=re.search(r'(<div class="index-item"[^>]*onclick="showSession\(20\)"[\s\S]*?</div>)',s); assert m
              s=s[:m.end()]+"\n"+ID_INDEX+s[m.end():]
              m=re.search(r'(<div class="index-item en-index-item"[^>]*onclick="showEnglishSession\(20\)"[\s\S]*?</div>)',s); assert m
              s=s[:m.end()]+"\n"+EN_INDEX+s[m.end():]
              # Append bilingual session pair immediately before the shared wrapper closes above footer.
              marker='</div>\n<footer>'
              assert marker in s
              s=s.replace(marker,ID_SESSION+EN_SESSION+'</div>\n<footer>',1)
              # Technical counters/revision only.
              s=s.replace('Sesi 001–020', 'Sesi 001–021').replace('SESSION 001–020','SESSION 001–021')
              s=s.replace('20 dari target ±1.000 sesi • ±2,0%', '21 dari target ±1.000 sesi • ±2,1%')
              s=s.replace('20 of approximately 1,000 sessions • ~2.0%', '21 of approximately 1,000 sessions • ~2.1%')
              s=s.replace('<div class="stats"><div class="stat"><b>20</b>Sesi</div><div class="stat"><b>33</b>Ayat utama</div><div class="stat"><b>2,0%</b>Target</div></div>', '<div class="stats"><div class="stat"><b>21</b>Sesi</div><div class="stat"><b>36</b>Ayat utama</div><div class="stat"><b>2,1%</b>Target</div></div>')
              s=s.replace('<div class="stats"><div class="stat"><b>20</b>Sessions</div><div class="stat"><b>33</b>Key verses</div><div class="stat"><b>2.0%</b>Target</div></div>', '<div class="stats"><div class="stat"><b>21</b>Sessions</div><div class="stat"><b>36</b>Key verses</div><div class="stat"><b>2.1%</b>Target</div></div>')
              s=s.replace('const TOTAL=20;', 'const TOTAL=21;')
              # QC invariants.
              assert s.count('id="s21"')==1 and s.count('id="en-s21"')==1
              assert s.count('data-session-number="21"')==2
              assert 'Sesi 022 →</span>' in s and 'Session 022 →</span>' in s
              assert 'Thank to Allah SWT proudly made by Suiza Ixan Saputro bin Ngalimin x chatgpt' in s
              assert 'const TOTAL=21;' in s
              p.write_text(s,encoding='utf-8')

          patch('index.html')
          patch('owner/index.html')
          # OWNER must remain namespaced/full-access; PUBLIC must retain public entitlement logic.
          pub=Path('index.html').read_text(encoding='utf-8'); own=Path('owner/index.html').read_text(encoding='utf-8')
          assert "K_START='tadabburJourneyStartDate'" in pub and 'function unlockedCount()' in pub
          assert 'ownerTadabbur' in own and "public-clean-runtime-v1" not in own
          # Remove this one-shot workflow in the same content commit.
          Path('.github/workflows/append-session-021.yml').unlink()
          PY
      - name: QC and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in ['index.html','owner/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              ids=re.findall(r'\bid="([^"]+)"',s)
              dup={x for x in ids if ids.count(x)>1}
              assert not dup, (f,dup)
              assert len(re.findall(r'<article class="session"',s))==21
              assert len(re.findall(r'<article class="en-session"',s))==21
              assert s.index('id="s21"') < s.index('<footer>')
              assert s.index('id="en-s21"') < s.index('<footer>')
              assert s.index('</div>\n<footer>') > s.index('id="en-s21"')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html owner/index.html .github/workflows/append-session-021.yml
          git commit -m 'Publish Tadabbur session 021 bilingual'
          git push
