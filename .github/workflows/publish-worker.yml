name: Publish TadabburLife Worker and report to Telegram

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "about/**"
      - "contact/**"
      - "cookies/**"
      - "disclaimer/**"
      - "privacy/**"
      - "terms/**"
      - "tadabbur/**"
      - "en/tadabbur/**"
      - "assets/**"
      - "og/reflection/**"
      - "data/**"
      - "scripts/build-worker-site.mjs"
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/publish-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tadabburlife-worker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.TADABBURLIFE_WORKER_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Qur'an progress
        run: python3 .github/scripts/quran_progress_qc.py

      - name: Check verse ownership
        run: python3 .github/scripts/ayat_ownership_qc.py

      - name: Check bilingual reader parity
        run: python3 .github/scripts/reader_content_parity_qc.py

      - name: Check session landing template
        run: python3 .github/scripts/session_template_contract_qc.py

      - name: Build public Worker bundle
        run: node scripts/build-worker-site.mjs

      - name: Deploy to Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.167.0"

      - name: Report publish result to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKER_URL: https://tadabburlife-site.wiztechid.workers.dev/
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          if (!token || !chatId) {
            console.warn("Telegram report skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured.");
            process.exit(0);
          }
          const status = process.env.PUBLISH_STATUS === "success" ? "BERHASIL" : "GAGAL";
          const sha = (process.env.COMMIT_SHA || "").slice(0, 7);
          const message = [
            `TadabburLife Worker — publikasi ${status}`,
            `Worker: ${process.env.WORKER_URL}`,
            `Commit: ${sha}`,
            `Rincian: ${process.env.RUN_URL}`,
          ].join("\n");
          const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ chat_id: chatId, text: message, disable_web_page_preview: true }),
          });
          if (!response.ok) {
            console.error(`Telegram report failed with HTTP ${response.status}.`);
            process.exitCode = 1;
          }
          NODE
