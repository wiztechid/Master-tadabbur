name: Sync Keyword Map to 94 Landings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-keyword-map.yml'
      - '.github/scripts/sync_keyword_map.py'

permissions:
  contents: write

jobs:
  sync-keyword-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and QC keyword map
        id: sync
        run: python3 .github/scripts/sync_keyword_map.py

      - name: Upload keyword-map QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tadabburlife-keyword-map-sync-qc
          path: qc-keyword-map-report/
          if-no-files-found: error
          retention-days: 30

      - name: Commit keyword map
        run: |
          if git diff --quiet -- seo/keyword-map.json; then
            echo "Keyword map already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/keyword-map.json
          git commit -m "SEO: sync keyword map to 94 landing implementations"
          git pull --rebase origin main
          git push
