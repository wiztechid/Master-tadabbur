name: Publish Tadabbur Batch 025-029
on:
  push:
    paths:
      - '.github/workflows/tadabbur-batch.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append five bilingual sessions and pagination
        shell: python
        run: |
          from pathlib import Path
          import re
          sessions=[
          (25,"AN-NISA 4:29","Jangan Ambil Hak Tanpa Kerelaan","Do Not Take Rights Without Mutual Consent","Muamalah, kerelaan, harta, hak","Transactions, consent, wealth, rights","يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَـٰطِلِ إِلَّآ أَن تَكُونَ تِجَـٰرَةً عَن تَرَاضٍۢ مِّنكُمْ ۚ وَلَا تَقْتُلُوٓا۟ أَنفُسَكُمْ ۚ إِنَّ ٱللَّهَ كَانَ بِكُمْ رَحِيمًۭا","Yā ayyuhallażīna āmanū lā ta’kulū amwālakum bainakum bil-bāṭili illā an takūna tijāratan ‘an tarāḍim minkum, wa lā taqtulū anfusakum. Innallāha kāna bikum raḥīmā.","Wahai orang-orang beriman, janganlah kamu memakan harta sesamamu dengan cara batil, kecuali melalui perdagangan yang berlangsung atas dasar saling rela; dan janganlah kamu membinasakan dirimu. Allah Maha Penyayang kepadamu.","O ye who believe! Squander not your wealth among yourselves in vanity, except it be a trade by mutual consent, and kill not one another. Lo! Allah is ever Merciful unto you.","Ibn Kathir dan al-Tabari menjelaskan larangan mengambil harta secara batil dan pentingnya kerelaan dalam transaksi yang sah.","Ibn Kathir and al-Tabari explain the prohibition of wrongful consumption of wealth and the importance of mutual consent in lawful trade.","Sahih al-Bukhari 2079: kejujuran dan keterbukaan para pihak menjadi sebab keberkahan transaksi; dusta dan menyembunyikan cacat menghapus keberkahannya.","Sahih al-Bukhari 2079 teaches that truthfulness and disclosure bring blessing to a sale, while lying and concealment erase its blessing.","Periksa satu transaksi atau kesepakatan hari ini: pastikan pihak lain memahami syarat penting dan benar-benar menyetujuinya tanpa manipulasi.","Review one transaction or agreement today: make sure the other party understands the material terms and truly consents without manipulation."),
          (26,"AL-BAQARAH 2:261","Harta yang Ditanam untuk Kebaikan","Wealth Planted for Good","Infak, kedermawanan, pahala, niat","Giving, generosity, reward, intention","مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍۢ مِّا۟ئَةُ حَبَّةٍۢ ۗ وَٱللَّهُ يُضَـٰعِفُ لِمَن يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","Maṡalullażīna yunfiqūna amwālahum fī sabīlillāhi kamaṡali ḥabbatin anbatat sab‘a sanābila fī kulli sunbulatim mi’atu ḥabbah. Wallāhu yuḍā‘ifu liman yasyā’. Wallāhu wāsi‘un ‘alīm.","Perumpamaan orang yang menginfakkan hartanya di jalan Allah seperti sebutir benih yang menumbuhkan tujuh tangkai, pada tiap tangkai seratus biji. Allah melipatgandakan bagi siapa yang Dia kehendaki; Allah Mahaluas lagi Maha Mengetahui.","The likeness of those who spend their wealth in Allah's way is as the likeness of a grain which groweth seven ears, in every ear a hundred grains. Allah giveth increase manifold to whom He will. Allah is All-Embracing, All-Knowing.","Ibn Kathir menerangkan ayat ini sebagai dorongan kuat untuk berinfak dengan ikhlas; pelipatgandaan berada dalam kehendak Allah, bukan rumus keuntungan duniawi.","Ibn Kathir presents this verse as powerful encouragement to sincere giving; multiplication belongs to Allah's will, not to a formula for worldly profit.","Sahih Muslim 2588: sedekah tidak mengurangi harta; hadis mengajarkan perspektif iman tentang keberkahan dan balasan Allah.","Sahih Muslim 2588 teaches that charity does not diminish wealth, directing the believer toward Allah's blessing and recompense.","Sisihkan satu bagian harta hari ini untuk manfaat yang jelas, tanpa menunggu jumlahnya menjadi besar dan tanpa mencari pujian.","Set aside one portion of wealth today for a clear benefit, without waiting for it to become large and without seeking praise."),
          (27,"LUQMAN 31:18","Jangan Berjalan dengan Kesombongan","Do Not Walk in Arrogance","Tawaduk, kesombongan, adab sosial","Humility, arrogance, social manners","وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا ۖ إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍۢ فَخُورٍۢ","Wa lā tuṣa‘‘ir khaddaka lin-nāsi wa lā tamsyi fil-arḍi maraḥā. Innallāha lā yuḥibbu kulla mukhtālin fakhūr.","Jangan memalingkan wajah dari manusia karena sombong dan jangan berjalan di bumi dengan angkuh. Sesungguhnya Allah tidak menyukai setiap orang yang sombong lagi membanggakan diri.","Turn not thy cheek in scorn toward folk, nor walk with pertness in the land. Lo! Allah loveth not each braggart boaster.","Ibn Kathir menjelaskan nasihat Luqman ini sebagai larangan merendahkan manusia dan berjalan dengan keangkuhan; nikmat tidak memberi izin untuk merasa lebih tinggi.","Ibn Kathir explains Luqman's counsel as a prohibition against looking down on people and walking arrogantly; blessings do not grant permission to feel superior.","Sahih Muslim 91: kesombongan dijelaskan sebagai menolak kebenaran dan meremehkan manusia.","Sahih Muslim 91 defines arrogance as rejecting truth and looking down on people.","Dalam satu percakapan hari ini, latih tawaduk: dengarkan sampai selesai dan jangan memakai jabatan, ilmu, harta, atau pengalaman untuk merendahkan lawan bicara.","In one conversation today, practice humility: listen fully and do not use position, knowledge, wealth, or experience to diminish the other person."),
          (28,"AL-HUJURAT 49:10","Damaikan, Jangan Hanya Menonton Konflik","Reconcile, Do Not Merely Watch Conflict","Persaudaraan, islah, konflik, takwa","Brotherhood, reconciliation, conflict, taqwa","إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌۭ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ","Innamal-mu’minūna ikhwatun fa aṣliḥū baina akhawaikum, wattaqullāha la‘allakum turḥamūn.","Sesungguhnya orang-orang beriman itu bersaudara; maka damaikanlah antara dua saudaramu dan bertakwalah kepada Allah agar kamu mendapat rahmat.","The believers are naught else than brothers. Therefore make peace between your brethren and observe your duty to Allah that haply ye may obtain mercy.","Ibn Kathir dan al-Tabari menekankan kewajiban islah ketika terjadi perselisihan di antara orang beriman; persaudaraan menuntut usaha memperbaiki, bukan memperbesar konflik.","Ibn Kathir and al-Tabari emphasize reconciliation when believers fall into dispute; brotherhood calls for repair rather than amplification of conflict.","Sahih al-Bukhari 6026: seorang mukmin bagi mukmin lain seperti bangunan yang bagian-bagiannya saling menguatkan.","Sahih al-Bukhari 6026 likens believers to a building whose parts strengthen one another.","Jika ada konflik di sekitar Anda, jangan menambah bahan bakar. Lakukan satu tindakan yang adil untuk memperjelas fakta, menurunkan tensi, atau membuka ruang dialog.","If conflict is near you, do not add fuel. Take one fair step to clarify facts, lower tension, or open space for dialogue."),
          (29,"AL-ANKABUT 29:69","Petunjuk Ditemukan dalam Kesungguhan","Guidance Is Met with Striving","Kesungguhan, hidayah, ikhtiar, ihsan","Striving, guidance, effort, excellence","وَٱلَّذِينَ جَـٰهَدُوا۟ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلْمُحْسِنِينَ","Wallażīna jāhadū fīnā lanahdiyannahum subulanā. Wa innallāha lama‘al-muḥsinīn.","Orang-orang yang bersungguh-sungguh di jalan Kami benar-benar akan Kami tunjukkan kepada mereka jalan-jalan Kami. Sesungguhnya Allah benar-benar bersama orang-orang yang berbuat ihsan.","As for those who strive in Us, We surely guide them to Our paths, and lo! Allah is with the good.","Ibn Kathir menjelaskan bahwa orang yang bersungguh-sungguh menaati Allah akan diberi petunjuk menuju jalan-jalan kebaikan. Kesungguhan di sini berada dalam ketaatan, bukan pembenaran untuk mengejar tujuan dengan cara apa pun.","Ibn Kathir explains that those who strive in obedience to Allah are guided toward paths of good. This striving remains within obedience, not a license to pursue goals by any means.","Sahih Muslim 2664: kejarlah apa yang bermanfaat, mohon pertolongan Allah, dan jangan menyerah pada ketidakberdayaan.","Sahih Muslim 2664: pursue what benefits you, seek Allah's help, and do not give in to helplessness.","Pilih satu kebaikan yang sudah lama Anda niatkan. Kerjakan langkah pertamanya hari ini selama minimal sepuluh menit, lalu lanjutkan secara konsisten.","Choose one good pursuit you have delayed. Work on its first step for at least ten minutes today, then continue consistently.")]
          def article(s,lang):
            n,ref,ti,te,ki,ke,ar,tr,idi,ene,tf_i,tf_e,hd_i,hd_e,act_i,act_e=s
            prev=n-1; nxt=n+1
            if lang=='id':
              title,keys,trans,tf,hd,act=ti,ki,idi,tf_i,hd_i,act_i; cls='session'; sid=f's{n}'; L='SESI'; back=f'← Sesi {prev:03d}'; journey='☰ Daftar'; nextt=f'Sesi {nxt:03d} →'; openfn='showSession'; wisdom='Ketaatan tidak berhenti pada pemahaman; ia harus mengubah pilihan yang kita buat hari ini.'; refl='Di bagian mana dari tema ini saya paling mudah mengetahui yang benar tetapi paling sulit melakukannya?'; fact='Ayat memberi prinsip wahyu yang jelas. Penerapannya pada kehidupan modern adalah pelajaran/analogi yang tetap memerlukan fakta dan aturan yang relevan; sesi ini tidak menjadikan ayat sebagai ramalan peristiwa modern.'
            else:
              title,keys,trans,tf,hd,act=te,ke,ene,tf_e,hd_e,act_e; cls='en-session'; sid=f'en-s{n}'; L='SESSION'; back=f'← Session {prev:03d}'; journey='☰ Journey'; nextt=f'Session {nxt:03d} →'; openfn='showEnglishSession'; wisdom='Obedience does not stop at understanding; it must reshape the choices we make today.'; refl='Where in this theme do I find it easiest to know what is right but hardest to do it?'; fact='The verse gives a clear revealed principle. Modern applications here are lessons or analogies that still require relevant facts and rules; this session does not treat the verse as a prediction of modern events.'
            source='' if lang=='id' else '<div class="en-note">English Qur\'an translation reference: M. Pickthall (public-domain translation). Arabic text and transliteration are identical to the Indonesian edition. Transliteration is a reading aid and does not replace tajwid or talaqqi.</div>'
            return f'''<article class="{cls}" data-lang="{lang}" data-session-number="{n}" id="{sid}"><div class="session-head"><small>{L} {n:03d} • {ref} • THEMATIC/NON-LINEAR</small><h2>{title}</h2><p>{keys}.</p></div><section class="feature card"><h3>🌙 {'Ayat Utama Hari Ini' if lang=='id' else "Today's Key Verse"}</h3><div class="ayahbox"><div class="ayah">{ar}</div><div class="latin">{tr}</div><div class="tr"><b>{ref} — {'Makna ringkas' if lang=='id' else 'M. Pickthall'}:</b> {trans}</div></div>{source}</section><section class="card"><h3>📚 {'Tafsir Mu‘tabar' if lang=='id' else 'Tafsir Notes'}</h3><details open><summary>{'Konteks dan prinsip' if lang=='id' else 'Context and principle'}</summary><p>{tf}</p></details></section><section class="card secondary"><h3>🤲 {'Hadis Sahih' if lang=='id' else 'Authentic Hadith'}</h3><p>{hd}</p></section><section class="card secondary"><h3>🌍 {'Konteks Faktual' if lang=='id' else 'Factual Context'}</h3><p>{fact}</p></section><section class="card secondary"><h3>🪞 {'Muhasabah' if lang=='id' else 'Reflection'}</h3><p>{refl}</p></section><section class="card call"><h3>💡 {'Hikmah Utama' if lang=='id' else 'Main Wisdom'}</h3><p><b>{wisdom}</b></p></section><section class="card"><h3>✅ {'Amal Praktis Hari Ini' if lang=='id' else 'Practical Action Today'}</h3><p>{act}</p></section><section class="card secondary"><h3>🔗 {'Hubungan dengan Perjalanan' if lang=='id' else 'Connection to the Journey'}</h3><p>{'Sesi' if lang=='id' else 'Session'} {prev:03d} {'menjadi pijakan sebelumnya; sesi ini membuka tema baru dengan ayat yang belum menjadi ayat utama perjalanan.' if lang=='id' else 'is the previous step; this session opens a new theme with a verse not previously used as a main verse.'}</p></section><div class="finish-reflection-wrap" data-lang="{lang}" data-session="{n}"><p>{'Sudah selesai membaca dan merenungkan sesi ini?' if lang=='id' else 'Finished reading and reflecting on this session?'}</p><button class="complete-reflection-btn primary" type="button">✓ {'Tandai Selesai Tadabbur' if lang=='id' else 'Mark Reflection Complete'}</button></div><div class="session-nav"><button onclick="{openfn}({prev})">{back}</button><button onclick="showJourney()">{journey}</button>{('<span class="btn disabled">'+nextt+'</span>') if n==29 else ('<button class="primary" onclick="'+openfn+'('+str(nxt)+')">'+nextt+'</button>')}</div></article>'''
          def patch(path,owner=False):
            p=Path(path); c=p.read_text()
            if 'id="s25"' in c: raise SystemExit(f'{path}: session 25 already exists')
            # index cards
            idcards=''.join(f'<div class="index-item" data-search="{s[5].lower()} {s[1].lower()}" onclick="showSession({s[0]})"><b>{s[0]:03d} — {s[2]}</b><br/><small>{s[1]} • {s[4]}</small></div>' for s in sessions)
            encards=''.join(f'<div class="index-item en-index-item" data-search="{s[5].lower()} {s[1].lower()}" onclick="showEnglishSession({s[0]})"><b>{s[0]:03d} — {s[3]}</b><br/><small>{s[1]} • {s[5]}</small></div>' for s in sessions)
            c=c.replace('</div></section>\n<div class="orn secondary">',idcards+'</div></section>\n<div class="orn secondary">',1)
            c=c.replace('</div>\n</section>\n<section class="mission-view" id="missions-id">',encards+'</div>\n</section>\n<section class="mission-view" id="missions-id">',1)
            # enable 24 -> 25
            c=c.replace('<span class="btn disabled">Sesi 025 →</span>','<button class="primary" onclick="showSession(25)">Sesi 025 →</button>')
            c=c.replace('<span class="btn disabled">Session 025 →</span>','<button class="primary" onclick="showEnglishSession(25)">Session 025 →</button>')
            block='\n'.join(article(s,'id')+'\n'+article(s,'en') for s in sessions)+'\n'
            c=c.replace('<footer>',block+'<footer>',1)
            c=c.replace('const TOTAL=24;','const TOTAL=29;')
            c=c.replace('Sesi 001–024','Sesi 001–029').replace('Sessions 001–024','Sessions 001–029')
            c=c.replace('24 dari target ±1.000 sesi • ±2,4%','29 dari target ±1.000 sesi • ±2,9%').replace('24 of a target ±1,000 sessions • ±2.4%','29 of a target ±1,000 sessions • ±2.9%')
            c=c.replace('<b>24</b>Sesi','<b>29</b>Sesi').replace('<b>24</b>Sessions','<b>29</b>Sessions').replace('<b>39</b>Ayat utama','<b>44</b>Ayat utama').replace('<b>39</b>Key verses','<b>44</b>Key verses').replace('<b>2,4%</b>Target','<b>2,9%</b>Target').replace('<b>2.4%</b>Target','<b>2.9%</b>Target')
            # pagination 17/session page, technical only; search bypasses pagination while query active
            style='''<style id="journey-pagination-17">.journey-pager{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.journey-pager button.active{background:#075b45;color:#fff8df}.journey-page-note{text-align:center;color:#64766f;font-size:13px}</style>'''
            c=c.replace('</head>',style+'</head>',1)
            js='''\nconst PAGE_SIZE=17;let journeyPage=1;function applyJourneyPage(){[['home','id'],['home-en','en']].forEach(([id,l])=>{const h=document.getElementById(id);if(!h)return;const q=(h.querySelector('.search')?.value||'').trim().toLowerCase(),cards=[...h.querySelectorAll('.index-item')];cards.forEach((x,i)=>{const match=!q||(x.dataset.search||'').toLowerCase().includes(q);x.style.display=match&&(q||Math.floor(i/PAGE_SIZE)+1===journeyPage)?'block':'none'});let pg=h.querySelector('.journey-pager');if(!pg){pg=document.createElement('div');pg.className='journey-pager';h.appendChild(pg)}const pages=Math.ceil(cards.length/PAGE_SIZE);pg.innerHTML='';for(let p=1;p<=pages;p++){const b=document.createElement('button');b.textContent=p;b.classList.toggle('active',p===journeyPage);b.onclick=()=>{journeyPage=p;applyJourneyPage();window.scrollTo({top:h.offsetTop-80,behavior:'smooth'})};pg.appendChild(b)}pg.style.display=q?'none':'flex'})}\n'''
            c=c.replace('function render(){',js+'function render(){',1)
            c=c.replace('render();window.scrollTo({top:0,behavior:\'smooth\'})};window.showHome=window.showJourney;','render();applyJourneyPage();window.scrollTo({top:0,behavior:\'smooth\'})};window.showHome=window.showJourney;',1)
            c=c.replace("window.filterSessions=function(){const q=(document.getElementById('search')?.value||'').toLowerCase();document.querySelectorAll('#home .index-item').forEach(x=>x.style.display=(x.dataset.search||'').toLowerCase().includes(q)?'block':'none')};","window.filterSessions=function(){applyJourneyPage()};")
            c=c.replace("window.filterEnglishSessions=function(){const q=(document.getElementById('search-en')?.value||'').toLowerCase();document.querySelectorAll('#home-en .index-item').forEach(x=>x.style.display=(x.dataset.search||'').toLowerCase().includes(q)?'block':'none')};","window.filterEnglishSessions=function(){applyJourneyPage()};")
            c=c.replace('render();if(localStorage.getItem(K_VIEW)', 'render();applyJourneyPage();if(localStorage.getItem(K_VIEW)',1)
            p.write_text(c)
          patch('index.html'); patch('owner/index.html',True)
          # QC
          for path in ['index.html','owner/index.html']:
            c=Path(path).read_text()
            assert 'const TOTAL=29;' in c and 'PAGE_SIZE=17' in c
            for n in range(25,30):
              assert c.count(f'id="s{n}"')==1 and c.count(f'id="en-s{n}"')==1
            assert c.index('<footer>')>c.index('id="en-s29"')
            assert c.count('Thank to Allah SWT proudly made by Suiza Ixan Saputro bin Ngalimin x chatgpt')==1
            assert 'stable-v1' in c
      - name: Commit canonical masters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html owner/index.html
          git commit -m 'Append Tadabbur sessions 025-029 and paginate Journey by 17'
          git push origin main
