name: Run Tadabbur Batch Publisher
on:
  push:
    paths:
      - '.github/workflows/run-tadabbur-batch.yml'
permissions:
  contents: write
jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute publisher script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          y=Path('.github/workflows/tadabbur-batch.yml').read_text()
          block=y.split('        run: |\n',1)[1].split('      - name: Commit canonical masters',1)[0]
          code=textwrap.dedent(block)
          exec(compile(code,'tadabbur-batch','exec'),{'__name__':'__main__'})
          PY
      - name: Commit canonical masters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html owner/index.html
          git commit -m 'Append Tadabbur sessions 025-029 and paginate Journey by 17'
          git push origin main
